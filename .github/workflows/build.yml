name: CARM Build (just upload the ZIP)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      proj: ${{ steps.u.outputs.proj }}
    steps:
      - uses: actions/checkout@v4
      - name: Unzip the newest ZIP in the repo
        id: u
        run: |
          Z=$(ls -1 *.zip 2>/dev/null | sort -V | tail -n1)
          [ -n "$Z" ] || { echo "No .zip found in repo root. Upload your CARM ZIP first."; exit 1; }
          echo "Using $Z"
          mkdir -p proj && unzip -q -o "$Z" -d proj
          I=$(find proj -name index.html -not -path '*/node_modules/*' | head -n1)
          [ -n "$I" ] || { echo "index.html not found inside the ZIP"; exit 1; }
          echo "proj=$(dirname "$I")" >> "$GITHUB_OUTPUT"
      - name: Apply logo.png (if present) and build number
        run: |
          P="${{ steps.u.outputs.proj }}"
          IM=$(command -v magick || command -v convert)
          if [ -f logo.png ]; then
            echo "Using logo.png from the repo"
            $IM logo.png -background "#0a0a0a" -flatten -resize 440x440 -gravity center -extent 512x512 "$P/icons/icon-512.png"
            $IM "$P/icons/icon-512.png" -resize 192x192 "$P/icons/icon-192.png"
          fi
          printf 'window.CARM_BUILD={n:%s,repo:"%s"};\n' "$GITHUB_RUN_NUMBER" "$GITHUB_REPOSITORY" > "$P/js/version.js"
      - uses: actions/upload-artifact@v4
        with:
          name: project
          path: ${{ steps.u.outputs.proj }}
  apk:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/download-artifact@v4
        with:
          name: project
          path: proj
      - name: Prepare Android app
        run: |
          cd proj
          echo '{"name":"carm","version":"1.0.0","private":true,"dependencies":{"@capacitor/android":"^6.1.0","@capacitor/cli":"^6.1.0","@capacitor/core":"^6.1.0"}}' > package.json
          echo '{"appId":"com.carm.app","appName":"CARM","webDir":"www","backgroundColor":"#0a0a0a","server":{"androidScheme":"https"}}' > capacitor.config.json
          rm -rf www && mkdir www
          cp -r index.html manifest.webmanifest sw.js css js icons www/
          npm install
          npx cap add android
          npx cap sync android
      - name: App icon, version number, signing key
        run: |
          cd proj
          IM=$(command -v magick || command -v convert)
          R=android/app/src/main/res
          for d in mdpi:48:108 hdpi:72:162 xhdpi:96:216 xxhdpi:144:324 xxxhdpi:192:432; do
            IFS=: read n s f <<< "$d"
            mkdir -p "$R/mipmap-$n"
            $IM icons/icon-512.png -resize ${s}x${s} "$R/mipmap-$n/ic_launcher.png"
            $IM icons/icon-512.png -resize ${s}x${s} "$R/mipmap-$n/ic_launcher_round.png"
            $IM -size ${f}x${f} xc:none \( icons/icon-512.png -resize $((f*62/100))x$((f*62/100)) \) -gravity center -composite "$R/mipmap-$n/ic_launcher_foreground.png"
          done
          sed -i 's/#FFFFFF/#0A0A0A/I' "$R/values/ic_launcher_background.xml" || true
          sed -i "s/versionCode 1/versionCode $GITHUB_RUN_NUMBER/;s/versionName \"1.0\"/versionName \"0.3.$GITHUB_RUN_NUMBER\"/" android/app/build.gradle || true
          if [ -f signing/debug.keystore ]; then mkdir -p ~/.android && cp signing/debug.keystore ~/.android/debug.keystore; echo "Using fixed signing key"; fi
      - name: Build APK
        run: |
          cd proj/android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/CARM.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: CARM-APK
          path: CARM.apk
      - name: Publish APK as a Release (direct download)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-${{ github.run_number }}" CARM.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "CARM APK build ${{ github.run_number }}" --notes "Auto-built Android APK"
  pages:
    needs: prepare
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: project
          path: proj
      - name: Website files only
        run: |
          rm -rf site && cp -r proj site
          rm -rf site/signing site/docs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: d
        uses: actions/deploy-pages@v4
