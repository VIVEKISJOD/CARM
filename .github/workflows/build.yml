name: CARM Build (just upload the ZIP)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Unzip the newest ZIP in the repo
        run: |
          Z=$(ls -1 *.zip 2>/dev/null | sort -V | tail -n1)
          [ -n "$Z" ] || { echo "No .zip found in repo root. Upload your CARM ZIP first."; exit 1; }
          echo "Using $Z"
          mkdir -p proj && unzip -q -o "$Z" -d proj
          I=$(find proj -name index.html -not -path '*/node_modules/*' | head -n1)
          [ -n "$I" ] || { echo "index.html not found inside the ZIP"; exit 1; }
          echo "PROJ=$(dirname "$I")" >> "$GITHUB_ENV"
      - name: Prepare Android app
        run: |
          cd "$PROJ"
          echo '{"name":"carm","version":"1.0.0","private":true,"dependencies":{"@capacitor/android":"^6.1.0","@capacitor/cli":"^6.1.0","@capacitor/core":"^6.1.0"}}' > package.json
          echo '{"appId":"com.carm.app","appName":"CARM","webDir":"www","backgroundColor":"#0a0a0a","server":{"androidScheme":"https"}}' > capacitor.config.json
          rm -rf www && mkdir www
          cp -r index.html manifest.webmanifest sw.js css js icons www/
          npm install
          npx cap add android
          npx cap sync android
      - name: Build APK
        run: |
          cd "$PROJ/android"
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/CARM.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: CARM-APK
          path: CARM.apk
      - name: Publish APK as a Release (direct download)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "apk-${{ github.run_number }}" CARM.apk --target "$GITHUB_SHA" --title "CARM APK #${{ github.run_number }}" --notes "Auto-built Android APK"
  pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Unzip the newest ZIP in the repo
        run: |
          Z=$(ls -1 *.zip 2>/dev/null | sort -V | tail -n1)
          [ -n "$Z" ] || { echo "No .zip found in repo root."; exit 1; }
          mkdir -p proj && unzip -q -o "$Z" -d proj
          I=$(find proj -name index.html -not -path '*/node_modules/*' | head -n1)
          [ -n "$I" ] || { echo "index.html not found inside the ZIP"; exit 1; }
          rm -rf site && cp -r "$(dirname "$I")" site && rm -rf site/.github
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: d
        uses: actions/deploy-pages@v4
